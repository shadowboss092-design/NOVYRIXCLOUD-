<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Register — NOVYRIXCLOUD</title><link rel="stylesheet" href="/styles.css"><style>.authwrap{max-width:470px;margin:55px auto 90px;padding:20px}.authbox{padding:28px;border:1px solid #294477;border-radius:22px;background:#0b1228dd;box-shadow:0 20px 70px #0008;backdrop-filter:blur(18px)}.authbox input{width:100%;padding:13px;border:1px solid #2a3e70;background:#070d1d;color:#fff;border-radius:10px;margin:7px 0 15px}.authbox label{color:#b9c9e9;font-size:.9rem}.authbox button{width:100%;margin-top:8px}.switch{display:flex;gap:8px;margin:20px 0}.switch button{width:50%}.msg{min-height:24px;color:#70f4c5}.muted{color:#a6b4d4}</style></head><body><header class="nav"><a class="brand" href="/"><img data-logo src="https://i.postimg.cc/wTdcCwpc/NC.png" alt=""><span data-brand>NOVYRIXCLOUD</span></a><nav class="nav-links"><a href="/">Home</a><a href="/plans">Plans</a><a href="/tickets">Tickets</a></nav></header><main class="authwrap"><section class="authbox"><div class="eyebrow">◈ CUSTOMER PORTAL</div><h1 id="heading">Create your <span class="shine">account</span></h1><p class="muted">Sign in to manage support tickets and contact NOVYRIXCLOUD.</p><div class="switch"><button class="btn btn-primary" id="registerTab" type="button">Register</button><button class="btn btn-secondary" id="loginTab" type="button">Login</button></div><form id="form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="190"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required maxlength="200"><button class="btn btn-primary" id="submit" type="submit">Create account ↗</button></form><p class="msg" id="msg" role="status"></p><p class="muted" style="font-size:.8rem">Use a unique password. This demo stores accounts on your server.</p></section></main><script src="/config.js"></script><script>const $=id=>document.getElementById(id);let mode='register';document.querySelectorAll('[data-brand]').forEach(e=>e.textContent=window.NOVYRIX_CONFIG?.brand||'NOVYRIXCLOUD');document.querySelectorAll('[data-logo]').forEach(e=>e.src=window.NOVYRIX_CONFIG?.logo||e.src);function setMode(m){mode=m;$('heading').innerHTML=m==='register'?'Create your <span class="shine">account</span>':'Welcome <span class="shine">back</span>'; $('submit').textContent=m==='register'?'Create account ↗':'Login ↗';$('password').autocomplete=m==='register'?'new-password':'current-password';$('registerTab').className='btn '+(m==='register'?'btn-primary':'btn-secondary');$('loginTab').className='btn '+(m==='login'?'btn-primary':'btn-secondary');$('msg').textContent=''}$('registerTab').onclick=()=>setMode('register');$('loginTab').onclick=()=>setMode('login');$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Please wait…';try{let r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');location.href='/tickets'}catch(err){$('msg').textContent=err.message}};fetch('/api/me').then(r=>r.json()).then(d=>{if(d.user)location.href='/tickets'});</script></body></html>
