<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Tickets — NOVYRIXCLOUD</title><link rel="stylesheet" href="/styles.css"><style>.wrap{max-width:1050px;margin:40px auto 80px;padding:0 18px}.panel{padding:clamp(18px,3vw,30px);background:#0b1228df;border:1px solid #294477;border-radius:22px;box-shadow:0 20px 70px #0007;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{color:#b9c9e9;font-size:.9rem}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #2a3e70;background:#070d1d;color:#fff;border-radius:10px;font:inherit}.ticket{padding:15px;border:1px solid #294477;background:#080f22;border-radius:14px;margin:12px 0}.muted{color:#a6b4d4}.status{color:#72f0c4}.msg{min-height:24px;color:#72f0c4}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header class="nav"><a class="brand" href="/"><img data-logo src="https://i.postimg.cc/wTdcCwpc/NC.png" alt=""><span data-brand>NOVYRIXCLOUD</span></a><nav class="nav-links"><a href="/">Home</a><a href="/plans">Plans</a><a class="active" href="/tickets">Tickets</a><a href="/admin">Admin</a></nav></header><main class="wrap"><section class="panel"><div class="eyebrow">◈ CUSTOMER SUPPORT</div><h1>Your <span class="shine">Tickets</span></h1><p class="muted" id="welcome">Create a ticket and track replies from the NOVYRIXCLOUD team.</p><button class="btn btn-secondary" id="logout" type="button">Log out</button></section><section class="panel"><h2>Create a ticket</h2><form id="ticketForm" class="grid"><div class="field"><label for="subject">Ticket subject</label><input id="subject" required minlength="4" maxlength="100" placeholder="e.g. Minecraft server won't start"></div><div class="field"><label for="category">Category</label><select id="category"><option>General</option><option>Billing</option><option>Minecraft Hosting</option><option>VPS Hosting</option><option>Bot Hosting</option><option>Technical Issue</option></select></div><div class="field full"><label for="message">Describe the issue</label><textarea id="message" rows="5" required minlength="10" maxlength="4000" placeholder="Tell us what happened…"></textarea></div><div class="field full"><button class="btn btn-primary" type="submit">＋ Create Ticket</button></div></form><p id="msg" class="msg" role="status"></p></section><section class="panel"><h2>My tickets</h2><div id="ticketList" class="muted">Loading tickets…</div></section></main><script src="/config.js"></script><script>const $=id=>document.getElementById(id);document.querySelectorAll('[data-brand]').forEach(e=>e.textContent=window.NOVYRIX_CONFIG?.brand||'NOVYRIXCLOUD');document.querySelectorAll('[data-logo]').forEach(e=>e.src=window.NOVYRIX_CONFIG?.logo||e.src);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{let me=await api('/api/me');if(!me.user){location.href='/auth';return}$('welcome').textContent='Signed in as '+me.user.email;let d=await api('/api/tickets');$('ticketList').innerHTML=d.tickets.length?d.tickets.map(t=>`<article class="ticket"><strong>${esc(t.subject)}</strong> <span class="status">${esc(t.status)}</span><p class="muted">${esc(t.category)} · ${new Date(t.createdAt).toLocaleString()}</p><p>${esc(t.message)}</p></article>`).join(''):'No tickets yet. Create your first ticket above.'}catch(e){$('ticketList').textContent=e.message}}$('ticketForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Creating ticket…';try{await api('/api/tickets',{method:'POST',body:JSON.stringify({subject:$('subject').value,category:$('category').value,message:$('message').value})});$('ticketForm').reset();$('msg').textContent='Ticket created successfully.';await load()}catch(err){$('msg').textContent=err.message}};$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='/auth'};load();</script></body></html>
